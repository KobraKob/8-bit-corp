default_provider: groq
providers:
  groq:
    adapter: groq
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
  openai_compatible:
    adapter: openai_compatible
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
  ollama:
    adapter: ollama
    base_url: http://localhost:11434/v1
    api_key_env: OLLAMA_API_KEY
  mock:
    adapter: mock
    base_url: mock://internal
    api_key_env: MOCK_API_KEY

tiers:
  fast:
    provider: groq
    model: openai/gpt-oss-20b
    fallbacks:
      - qwen/qwen3.8-27b
      - openai/gpt-oss-120b
      - llama-3.1-8b-instant
  smart:
    provider: groq
    model: openai/gpt-oss-120b
    fallbacks:
      - qwen/qwen3.8-27b
      - openai/gpt-oss-20b
      - llama-3.3-70b-versatile
  premium:
    provider: groq
    model: openai/gpt-oss-120b
    fallbacks:
      - qwen/qwen3.8-27b
      - openai/gpt-oss-20b
      - llama-3.3-70b-versatile

limits:
  openai/gpt-oss-20b:
    rpm: 30
    tpm: 6000
    rpd: 1000
    tpd: 100000
  openai/gpt-oss-120b:
    rpm: 30
    tpm: 6000
    rpd: 1000
    tpd: 100000
  qwen/qwen3.8-27b:
    rpm: 30
    tpm: 6000
    rpd: 1000
    tpd: 100000
  llama-3.1-8b-instant:
    rpm: 30
    tpm: 6000
    rpd: 1000
    tpd: 100000
  llama-3.3-70b-versatile:
    rpm: 30
    tpm: 6000
    rpd: 1000
    tpd: 100000
  mock-model:
    rpm: 5000
    tpm: 10000000
    rpd: 1000000
    tpd: 100000000
